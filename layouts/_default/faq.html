{{ define "main" }}
<!-- 引入 Google Fonts: Anybody 字型 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

<style>
    /* 針對 FAQ 答案內文 Markdown 元素設定標準 CSS 樣式 */
    .faq-markdown-content table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 1rem;
        margin-bottom: 1rem;
        border-radius: 0.5rem;
        overflow: hidden;
    }
    .faq-markdown-content th, 
    .faq-markdown-content td {
        border: 1px solid #e5e7eb;
        padding: 0.75rem 1rem;
        text-align: left;
    }
    .faq-markdown-content th {
        background-color: #f8fafc;
        font-weight: 700;
        color: #1C1C1C;
    }
    .faq-markdown-content a {
        color: #1155CC;
        text-decoration: underline;
        font-weight: 600;
        word-break: break-all;
    }
    .faq-markdown-content a:hover {
        color: #0b3d91;
    }
    .faq-markdown-content img {
        max-width: 100%;
        height: auto;
        border-radius: 0.75rem;
        margin-top: 1rem;
        margin-bottom: 1rem;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .faq-markdown-content ul {
        list-style-type: disc;
        padding-left: 1.5rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
    }
    .faq-markdown-content ol {
        list-style-type: decimal;
        padding-left: 1.5rem;
        margin-top: 0.5rem;
        margin-bottom: 0.5rem;
    }
</style>

<div class="font-['Anybody',sans-serif]">

    <!-- 1. 置頂標題區 (#F1FAFF 淺藍背景) -->
    <div class="w-full bg-[#F1FAFF] py-8 md:py-12 text-center">
        <div class="w-full max-w-4xl mx-auto px-4">
            <h1 class="text-[32px] md:text-[40px] font-black tracking-wider text-[#1C1C1C] mb-3">
                {{ .Title }}
            </h1>
            {{ if .Params.subtitle }}
            <p class="text-[#999999] text-[15px] md:text-[16px] font-normal mb-6">{{ .Params.subtitle }}</p>
            {{ end }}

            <!-- 關鍵字搜尋框 -->
            <div class="max-w-xl mx-auto relative">
                <input type="text"
                       id="faq-search"
                       placeholder="輸入關鍵字搜尋問題或答案..."
                       class="w-full py-3.5 px-5 pr-12 text-[16px] bg-white border border-gray-300 rounded-2xl shadow-sm focus:outline-none focus:border-[#1155CC] focus:ring-2 focus:ring-blue-100 transition-all text-[#1C1C1C]">
                <div class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- 外層容器 -->
    <div class="w-full max-w-7xl mx-auto px-4 py-8 md:py-12 text-[#1C1C1C]">

        <!-- 2. 動態生成分類按鈕區塊 -->
        <div class="w-full mx-auto mb-10">
            <div id="category-buttons-container" class="flex flex-wrap justify-center gap-2.5 md:gap-3">
                <button type="button"
                        data-category="all"
                        class="category-btn py-2.5 px-4 bg-[#1155CC] text-white border border-[#1155CC] text-[15px] md:text-[16px] font-bold rounded-2xl transition-all duration-200 shadow-sm active:scale-95">
                    全部問題
                </button>
            </div>
        </div>

        <!-- 隱藏的原始 Hugo .Content 渲染結果，供 JS 讀取解析 -->
        <div id="faq-raw-content" class="hidden">
            {{ .Content }}
        </div>

        <!-- 3. 解析後重構的 FAQ 手風琴列表 -->
        <div id="faq-list-container" class="w-full max-w-4xl mx-auto space-y-4"></div>

        <!-- 無結果提示 -->
        <div id="no-results" class="hidden text-center text-[#999999] py-16 text-[16px] font-normal">
            未找到符合關鍵字或分類的相關問題
        </div>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    var rawContainer = document.getElementById("faq-raw-content");
    var listContainer = document.getElementById("faq-list-container");
    var categoryButtonsContainer = document.getElementById("category-buttons-container");
    var searchInput = document.getElementById("faq-search");
    var noResults = document.getElementById("no-results");

    if (!rawContainer) return;

    var currentCategory = "all";
    var currentKeyword = "";
    var categoriesSet = new Set();

    // 1. 解析原始 DOM，將 # (H1) 轉為分類，## (H2) 轉為問題與答案區塊
    var children = Array.from(rawContainer.children);
    var activeCategory = "未分類";
    var activeQuestionTitle = "";
    var activeAnswerNodes = [];

    function flushCurrentFAQ() {
        if (!activeQuestionTitle) return;

        var itemDiv = document.createElement("div");
        itemDiv.className = "faq-item border border-gray-200 rounded-2xl overflow-hidden bg-white shadow-sm hover:shadow-md transition-all duration-200";
        itemDiv.setAttribute("data-category", activeCategory);

        // 建立問題按鈕
        var toggleBtn = document.createElement("button");
        toggleBtn.type = "button";
        toggleBtn.className = "faq-toggle w-full px-6 py-5 flex justify-between items-center text-left text-[17px] md:text-[18px] font-bold text-[#1C1C1C] hover:text-[#1155CC] transition-colors focus:outline-none";
        toggleBtn.innerHTML = 
            '<span class="pr-4 flex items-center gap-2.5 flex-wrap">' +
                '<span class="inline-block px-2.5 py-0.5 text-[12px] font-bold bg-blue-50 text-[#1155CC] rounded-lg shrink-0">' +
                    activeCategory +
                '</span>' +
                '<span>' + activeQuestionTitle + '</span>' +
            '</span>' +
            '<span class="faq-icon text-[#1155CC] text-2xl font-light transform transition-transform duration-200 shrink-0">+</span>';

        // 建立答案容器
        var answerDiv = document.createElement("div");
        answerDiv.className = "faq-answer hidden px-6 pb-6 pt-2 text-[15px] md:text-[16px] text-gray-700 leading-relaxed border-t border-gray-100 faq-markdown-content";
        
        var answerPlainText = "";
        activeAnswerNodes.forEach(function (node) {
            var clonedNode = node.cloneNode(true);

            // 自動處理 Leaf Bundle 內的 PDF 檔案超連結 (加上 target="_blank")
            var links = clonedNode.querySelectorAll ? clonedNode.querySelectorAll("a") : [];
            links.forEach(function (a) {
                var href = a.getAttribute("href") || "";
                if (href.endsWith(".pdf") || href.startsWith("http")) {
                    a.setAttribute("target", "_blank");
                    a.setAttribute("rel", "noopener noreferrer");
                }
            });

            answerDiv.appendChild(clonedNode);
            answerPlainText += " " + (node.textContent || "");
        });

        itemDiv.setAttribute("data-search-text", (activeQuestionTitle + " " + answerPlainText).toLowerCase());

        itemDiv.appendChild(toggleBtn);
        itemDiv.appendChild(answerDiv);
        listContainer.appendChild(itemDiv);

        // 重置當前問題變數
        activeQuestionTitle = "";
        activeAnswerNodes = [];
    }

    children.forEach(function (node) {
        var tagName = node.tagName ? node.tagName.toLowerCase() : "";

        if (tagName === "h1") {
            flushCurrentFAQ();
            activeCategory = node.textContent.trim();
            categoriesSet.add(activeCategory);
        } else if (tagName === "h2") {
            flushCurrentFAQ();
            activeQuestionTitle = node.textContent.trim();
        } else {
            if (activeQuestionTitle) {
                activeAnswerNodes.push(node);
            }
        }
    });
    flushCurrentFAQ(); // 處理最後一個問題

    // 2. 依據 Markdown 中出現的分類動態生成分類選單按鈕
    categoriesSet.forEach(function (cat) {
        var btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("data-category", cat);
        btn.className = "category-btn py-2.5 px-4 bg-white text-[#1C1C1C] border border-gray-200 hover:border-[#1155CC] hover:text-[#1155CC] text-[15px] md:text-[16px] font-bold rounded-2xl transition-all duration-200 shadow-sm active:scale-95";
        btn.textContent = cat;
        categoryButtonsContainer.appendChild(btn);
    });

    var categoryBtns = document.querySelectorAll(".category-btn");
    var faqItems = document.querySelectorAll(".faq-item");

    // 3. 核心過濾功能 (分類 + 關鍵字搜尋)
    function filterFAQs() {
        var visibleCount = 0;

        faqItems.forEach(function (item) {
            var itemCategory = item.getAttribute("data-category") || "";
            var itemSearchText = item.getAttribute("data-search-text") || "";

            var matchesCategory = (currentCategory === "all") || (itemCategory === currentCategory);
            var matchesKeyword = !currentKeyword || itemSearchText.includes(currentKeyword.toLowerCase());

            if (matchesCategory && matchesKeyword) {
                item.classList.remove("hidden");
                visibleCount++;
            } else {
                item.classList.add("hidden");
            }
        });

        if (visibleCount === 0) {
            noResults.classList.remove("hidden");
        } else {
            noResults.classList.add("hidden");
        }
    }

    // 關鍵字搜尋事件
    searchInput.addEventListener("input", function (e) {
        currentKeyword = e.target.value.trim();
        filterFAQs();
    });

    // 分類按鈕點擊事件
    categoryBtns.forEach(function (btn) {
        btn.addEventListener("click", function () {
            currentCategory = this.getAttribute("data-category");

            categoryBtns.forEach(function (b) {
                if (b === btn) {
                    b.classList.remove("bg-white", "text-[#1C1C1C]", "border-gray-200");
                    b.classList.add("bg-[#1155CC]", "text-white", "border-[#1155CC]");
                } else {
                    b.classList.remove("bg-[#1155CC]", "text-white", "border-[#1155CC]");
                    b.classList.add("bg-white", "text-[#1C1C1C]", "border-gray-200");
                }
            });

            filterFAQs();
        });
    });

    // 4. 折疊手風琴點擊開關
    document.addEventListener("click", function (e) {
        var toggleBtn = e.target.closest(".faq-toggle");
        if (!toggleBtn) return;

        var item = toggleBtn.closest(".faq-item");
        var answer = item.querySelector(".faq-answer");
        var icon = item.querySelector(".faq-icon");

        var isOpen = !answer.classList.contains("hidden");

        if (isOpen) {
            answer.classList.add("hidden");
            icon.textContent = "+";
        } else {
            answer.classList.remove("hidden");
            icon.textContent = "−";
        }
    });
});
</script>
{{ end }}
