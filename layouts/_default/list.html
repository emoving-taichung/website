{{ define "main" }}
<section class="max-w-4xl mx-auto py-8 px-4">
  <h1 class="text-3xl font-bold mb-6">{{ .Title }}</h1>
  <ul class="space-y-4">
    {{ range .Pages }}
    <li>
      <a href="{{ .RelPermalink }}" class="text-blue-600 hover:underline text-lg font-semibold">{{ .Title }}</a>
    </li>
    {{ end }}
  </ul>
</section>
{{ end }}
