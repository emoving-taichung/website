{{ define "main" }}
<!-- 表單 HTML 保持不變 -->
<div class="w-full bg-[#f7f9fb] text-[#1a202c] min-h-screen py-10 px-4 md:px-8">
    <div id="booking-container" class="max-w-2xl mx-auto bg-white rounded-2xl border border-gray-200 p-6 md:p-10 shadow-sm space-y-8">
        <!-- 頁面 HTML ... -->
    </div>
</div>

<script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbyjLSjB8OI3aSzS5H0FIE2kL3Ihqx9_uAyvFBCcKnrQctcgi8td5NLzozb9bixZrYAb/exec";
    
    let globalConfig = null;

    const vehicles = [
      { value: "Shine", name: "免駕照｜Shine", image: '{{ "images/vehicles/em25.png" | relURL }}' },
      { value: "EZ1",   name: "綠牌｜EZ1",   image: '{{ "images/vehicles/ez1.png" | relURL }}' },
      { value: "EZR",   name: "白牌｜EZR",   image: '{{ "images/vehicles/ezr.png" | relURL }}' },
      { value: "IE",    name: "白牌｜勁炫125", image: '{{ "images/vehicles/kg.png" | relURL }}' },
      { value: "FUN",   name: "白牌｜FUN",   image: '{{ "images/vehicles/fun.png" | relURL }}' }
    ];

    document.addEventListener('DOMContentLoaded', function() {
        initVehicleScrollDrag();
        initUI();
        fetchInitialData();
    });

    function initVehicleScrollDrag() {
        const slider = document.getElementById('vehicle-scroll');
        let isDown = false, startX, scrollLeft;

        slider.addEventListener('mousedown', (e) => {
            isDown = true;
            startX = e.pageX - slider.offsetLeft;
            scrollLeft = slider.scrollLeft;
        });
        slider.addEventListener('mouseleave', () => isDown = false);
        slider.addEventListener('mouseup', () => isDown = false);
        slider.addEventListener('mousemove', (e) => {
            if(!isDown) return;
            e.preventDefault();
            const x = e.pageX - slider.offsetLeft;
            const walk = (x - startX) * 2;
            slider.scrollLeft = scrollLeft - walk;
        });
    }

    function initUI() {
        const scrollBox = document.getElementById('vehicle-scroll');
        vehicles.forEach(v => {
            const card = document.createElement('div');
            card.className = "vehicle-card flex-shrink-0 w-32 border border-gray-200 rounded-xl cursor-pointer hover:border-gray-400 transition-all overflow-hidden relative bg-white";
            
            // 修正點：加上 flex 與 leading-none，解決勾勾沒置中的問題
            card.innerHTML = `
                <div class="check-icon absolute top-2 right-2 w-5 h-5 bg-[#0085d9] rounded-full hidden flex items-center justify-center text-white text-[10px] leading-none select-none">✓</div>
                <div class="w-full aspect-square bg-gray-50 p-2 flex items-center justify-center">
                    <img src="${v.image}" class="w-full h-full object-contain pointer-events-none" alt="${v.name}">
                </div>
                <div class="p-2.5 text-center text-xs font-medium text-gray-700 card-title">${v.name}</div>
            `;
            card.onclick = () => onVehicleSelect(v.value, card);
            scrollBox.appendChild(card);
        });

        document.getElementById('booking_date').min = new Date().toISOString().split('T')[0];

        document.getElementById('phone').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 10);
        });
    }

    function fetchInitialData() {
        fetch(GAS_URL + "?action=getData")
            .then(res => res.json())
            .then(res => {
                if (res.success) globalConfig = res;
            })
            .catch(err => {
                console.warn('門市資料背景載入失敗：', err);
            });
    }

    function onVehicleSelect(val, el) {
        // 防錯點：若資料尚未載入完成，提示使用者
        if (!globalConfig) {
            alert('門市資料連線中，請稍候 1~2 秒再點選！');
            return;
        }

        document.getElementById('vehicle').value = val;
        
        // 切換選取外觀與勾勾顯示
        document.querySelectorAll('.vehicle-card').forEach(c => {
            c.classList.remove('border-[#0085d9]', 'border-2');
            c.querySelector('.check-icon').classList.add('hidden');
            c.querySelector('.card-title').classList.remove('text-[#0085d9]', 'font-bold');
        });
        
        el.classList.add('border-[#0085d9]', 'border-2');
        el.querySelector('.check-icon').classList.remove('hidden'); // 顯現時自帶 flex 置中
        el.querySelector('.card-title').classList.add('text-[#0085d9]', 'font-bold');

        document.getElementById('err-vehicle').classList.add('hidden');

        // 渲染行政區
        const distSelect = document.getElementById('district');
        distSelect.innerHTML = '<option value="">請選擇行政區</option>';
        
        const list = globalConfig.vehicleMap ? (globalConfig.vehicleMap[val] || []) : [];
        list.forEach(d => distSelect.insertAdjacentHTML('beforeend', `<option value="${d}">${d}</option>`));
        
        distSelect.disabled = false;
        document.getElementById('store_name').disabled = true;
        document.getElementById('store_name').innerHTML = '<option value="">請先選擇行政區</option>';
        document.getElementById('booking_date').disabled = true;
    }

    document.getElementById('district').onchange = function() {
        const storeSelect = document.getElementById('store_name');
        storeSelect.innerHTML = '<option value="">請選擇門市</option>';
        if (this.value && globalConfig) {
            (globalConfig.storeMap[this.value] || []).forEach(s => storeSelect.insertAdjacentHTML('beforeend', `<option value="${s.name}" data-addr="${s.address}">${s.name}</option>`));
            storeSelect.disabled = false;
            document.getElementById('booking_date').disabled = false;
        }
    };

    document.getElementById('store_name').onchange = function() {
        const opt = this.options[this.selectedIndex];
        document.getElementById('store_address').value = opt ? (opt.dataset.addr || '') : '';
    };

    document.getElementById('booking_date').onchange = function() {
        const timeSelect = document.getElementById('booking_time');
        const d = new Date(this.value);
        if (d.getDay() === 0) {
            alert('週日為門市公休日，請選擇其他試乘日期');
            this.value = '';
            return;
        }
        timeSelect.innerHTML = '<option value="">請選擇時段</option>';
        const dist = document.getElementById('district').value;
        const slots = (globalConfig && globalConfig.timeSlotMap && globalConfig.timeSlotMap[dist]) || ["10:00", "14:00", "16:00", "19:00"];
        slots.forEach(t => timeSelect.insertAdjacentHTML('beforeend', `<option value="${t}">${t}</option>`));
        timeSelect.disabled = false;
    };

    document.getElementById('booking-form').onsubmit = function(e) {
        e.preventDefault();
        
        const formObj = {
            vehicle: document.getElementById('vehicle').value,
            district: document.getElementById('district').value,
            store_name: document.getElementById('store_name').value,
            store_address: document.getElementById('store_address').value,
            booking_date: document.getElementById('booking_date').value,
            booking_time: document.getElementById('booking_time').value,
            name: document.getElementById('name').value.trim(),
            phone: document.getElementById('phone').value.trim(),
            email: document.getElementById('email').value.trim()
        };

        if(!formObj.vehicle || !formObj.district || !formObj.store_name || !formObj.booking_date || !formObj.booking_time || !formObj.name || formObj.phone.length !== 10) {
            alert('請完整填寫必填欄位與正確的 10 位數手機號碼。');
            return;
        }

        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerText = '傳送中...';

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(formObj),
            mode: 'no-cors'
        })
        .then(() => {
            document.getElementById('booking-form').classList.add('hidden');
            document.getElementById('success-msg').classList.remove('hidden');
        })
        .catch(err => {
            alert('傳送失敗，請稍後再試。');
            btn.disabled = false;
            btn.innerText = '送出預約';
        });
    };
</script>
{{ end }}
