{{ define "main" }}

<!-- 智慧客服滿版頁面容器（自動扣除上方導覽列高度，填滿螢幕高度） -->
<section class="w-full h-[calc(100dvh-70px)] bg-[#f9fcff] p-3 md:p-6 flex flex-col justify-center items-center">
    
    <!-- 智慧客服視窗容器 -->
    <div class="w-full max-w-4xl h-full flex flex-col">
        <div class="chat-container">
            <div class="chat-header">eMOVING 線上智慧客服</div>
            <div class="chat-box" id="chatBox">
                <div class="msg bot">您好！歡迎詢問 ✨<br />點擊右下角「選單」查看最新優惠資訊！</div>
            </div>

            <div class="menu-wrapper">
                <div class="options-list" id="optionsList">
                    <button class="opt-btn" onclick="handleSelect(1)">🔰 免駕照微電 | Shine、Bobe</button>
                    <button class="opt-btn" onclick="handleSelect(2)">🎀 綠牌輕型機車 | ez1</button>
                    <button class="opt-btn" onclick="handleSelect(3)">🛵 白牌125機車 | 勁炫</button>
                    <button class="opt-btn" onclick="handleSelect(4)">🛡️ 白牌125機車 | EZR</button>
                    <button class="opt-btn" onclick="handleSelect(5)">🍀 白牌125機車 | FUN</button>
                    <button class="opt-btn" onclick="handleSelect(6)">❓ 其他問題 / 聯繫客服</button>
                </div>
                <button class="menu-toggle" onclick="toggleMenu()">車款<br>選單</button>
            </div>
        </div>
    </div>

</section>

<!-- 智慧客服 CSS 樣式 -->
<style>
    .chat-container { 
        position: relative; 
        width: 100%; 
        height: 100%; /* 填滿外層容器高度，徹底解決下方空白問題 */
        margin: 0 auto; 
        background: #ffffff; 
        display: flex; 
        flex-direction: column; 
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 10px 25px rgba(0,0,0,0.08);
    }

    .chat-header { 
        background: #1155CC; 
        color: white; 
        padding: 16px; 
        text-align: center; 
        font-weight: bold; 
        font-size: 18px; 
        flex-shrink: 0;
    }

    .chat-box { 
        flex: 1; 
        overflow-y: auto; 
        padding: 20px; 
        display: flex; 
        flex-direction: column; 
        gap: 14px; 
        scroll-behavior: smooth; 
        background: #f8fafc;
    }

    .msg { max-width: 85%; padding: 14px; border-radius: 15px; font-size: 15px; line-height: 1.6; white-space: pre-wrap; word-wrap: break-word; }
    .bot { background: white; align-self: flex-start; border-bottom-left-radius: 2px; color: #1C1C1C; border: 1px solid #e2e8f0; box-shadow: 0 2px 5px rgba(0,0,0,0.03); }
    .user { background: #1155CC; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .msg a { color: #1155CC; font-weight: bold; }

    .inner-line-btn { display: block; background: #00b900; color: white !important; text-decoration: none; text-align: center; padding: 12px; border-radius: 8px; margin-top: 10px; font-weight: bold; }

    /* 選單樣式 */
    .menu-wrapper { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; align-items: flex-end; z-index: 100; }
    .options-list { 
        display: none; 
        background: white; 
        border-radius: 12px; 
        box-shadow: 0 8px 24px rgba(0,0,0,0.15); 
        padding: 8px; 
        margin-bottom: 10px; 
        width: 260px; 
        border: 1.5px solid #1155CC; 
    }
    .opt-btn { width: 100%; background: white; border: none; color: #333; padding: 12px; text-align: left; border-radius: 8px; cursor: pointer; font-size: 14px; border-bottom: 1px solid #eee; }
    .opt-btn:hover { background: #f0f7ff; color: #1155CC; font-weight: bold; }

    .menu-toggle { 
        width: 65px; height: 65px; 
        background: #1155CC; color: white; 
        border-radius: 50%; border: none;
        cursor: pointer; font-weight: bold; font-size: 14px;
        box-shadow: 0 4px 12px rgba(17,85,204,0.3);
        transition: transform 0.2s ease;
    }
    .menu-toggle:hover { transform: scale(1.05); }
</style>
