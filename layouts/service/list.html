{{ define "main" }}
<div class="max-w-4xl mx-auto px-4 py-12 text-gray-800">
    
    <!-- 頁面標題 -->
    <h1 class="text-3xl md:text-4xl font-black text-center mb-10 tracking-wider text-gray-900">
        {{ .Title }}
    </h1>

    <div class="max-w-2xl mx-auto space-y-8">
        
        <!-- 1. 車款選擇下拉選單 -->
        <div class="flex flex-col sm:flex-row items-start sm:items-center gap-3 sm:gap-6">
            <label for="car-select" class="text-lg font-bold text-gray-800 shrink-0">
                請選擇車款
            </label>
            <div class="relative w-full sm:w-72">
                <select id="car-select" 
                        onchange="handleFilterChange()" 
                        class="w-full bg-white border-2 border-blue-500 rounded-lg px-4 py-2 text-gray-800 font-medium appearance-none focus:outline-none focus:ring-2 focus:ring-blue-400 cursor-pointer shadow-sm">
                    <option value="">全部車款</option>
                    <option value="e-Moving">e-Moving</option>
                    <option value="EZ1">EZ1</option>
                    <option value="iE125">iE125</option>
                    <option value="Shine">Shine</option>
                </select>
                <!-- 下拉箭頭圖示 -->
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-blue-600">
                    <svg class="w-5 h-5 fill-current" viewBox="0 0 20 20">
                        <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                    </svg>
                </div>
            </div>
        </div>

        <!-- 2. 區域選擇按鈕網格 -->
        <div class="space-y-4">
            <h2 class="text-lg font-bold text-gray-800">請選擇區域</h2>
            
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 md:gap-4">
                {{ $regions := slice "西區" "北區" "南區" "東區" "中區" "屯區" "海線" "山線" "潭雅神" "大甲區" "豐原區" "彰化區" }}
                {{ range $regions }}
                <button type="button" 
                        data-region="{{ . }}"
                        onclick="selectRegion(this, '{{ . }}')"
                        class="region-btn w-full py-2.5 px-3 bg-white border border-blue-400 text-blue-900 rounded-xl font-medium text-center hover:bg-blue-50 transition-all duration-200 shadow-sm hover:shadow active:scale-95">
                    {{ . }}
                </button>
                {{ end }}
            </div>
        </div>

    </div>

    <!-- 搜尋結果顯示區域 -->
    <div id="store-result-container" class="max-w-3xl mx-auto mt-12 space-y-4">
        <!-- 經 JavaScript 動態渲染門市列表 -->
        <p class="text-center text-gray-400 py-8">請選擇區域或車款以查看據點列表</p>
    </div>

</div>

<script>
let selectedRegion = "";

function selectRegion(btnElement, regionName) {
    // 切換按鈕選取狀態樣式
    const allBtns = document.querySelectorAll(".region-btn");
    allBtns.forEach(btn => {
        btn.classList.remove("bg-blue-600", "text-white", "border-blue-600");
        btn.classList.add("bg-white", "text-blue-900", "border-blue-400");
    });

    if (selectedRegion === regionName) {
        selectedRegion = ""; // 取消選取
    } else {
        selectedRegion = regionName;
        btnElement.classList.remove("bg-white", "text-blue-900", "border-blue-400");
        btnElement.classList.add("bg-blue-600", "text-white", "border-blue-600");
    }

    handleFilterChange();
}

function handleFilterChange() {
    const carModel = document.getElementById("car-select").value;
    const container = document.getElementById("store-result-container");
    
    // 此處可結合資料庫或 JSON 進行篩選比對
    console.log("當前篩選條件 - 車款:", carModel, "區域:", selectedRegion);
}
</script>
{{ end }}
